project_id = "mavinci-event-art"

[functions.send-crm-notification-push]
verify_jwt = false

# Event Rulers and other trusted integrations authenticate inside the function
# with keys stored in public.webhook_sources. Supabase JWT verification must be
# disabled here, otherwise the gateway rejects those keys before the function
# can validate them.
[functions.receive-webhook]
verify_jwt = false

[functions.qualify-incoming-email]
verify_jwt = true

[functions.assist-inquiry]
verify_jwt = true

[functions.audit-contract]
verify_jwt = true

[functions.send-marketing-campaign-test]
verify_jwt = true

[functions.sync-email-read-state]
verify_jwt = true

[functions.process-marketing-campaigns]
verify_jwt = false

[functions.schedule-email]
verify_jwt = true

[functions.process-scheduled-emails]
verify_jwt = false

[functions.unsubscribe-marketing]
verify_jwt = false

[functions.track-marketing-event]
verify_jwt = false

[functions.send-subcontractor-assignment]
verify_jwt = true

[functions.respond-subcontractor-assignment]
verify_jwt = false

[functions.process-subcontractor-reminders]
verify_jwt = false

[functions.sync-ksef-daily]
verify_jwt = true

[functions.extract-external-invoice]
verify_jwt = true

[functions.generate-subcontractor-guidelines]
verify_jwt = true

[functions.translate-product]
verify_jwt = true

[functions.translate-offer]
verify_jwt = true

# Import przetargów: pg_cron wysyła klucz anon z Vault (JWT) i docelowo X-Internal-Function-Secret,
# CRM wysyła token sesji. Dziś wdrożone z verify_jwt = false (bez wpisu tutaj); kontrola wywołującego
# jest w funkcji — patrz docs/edge-functions-access.md.
[functions.fetch-tenders]
verify_jwt = true
