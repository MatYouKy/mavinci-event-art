name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  migrations:
    name: Migracje
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/ci/check-migrations.mjs

  web:
    name: Typy, lint i build
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: 1
      # Build nie łączy się z bazą; wartości zastępcze wystarczą do kompilacji.
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
      SUPABASE_SERVICE_ROLE_KEY: ci-placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
      - run: yarn install --frozen-lockfile
      # Kontrola typów i lint raportują błędy, ale na razie nie blokują (next.config.js ma ignoreBuildErrors).
      # Po wyczyszczeniu modułu zmień continue-on-error na false i włącz kontrolę w next.config.js.
      - name: Kontrola typów (raport)
        run: yarn tsc --noEmit --pretty false
        continue-on-error: true
      - name: Lint (raport)
        run: yarn lint
        continue-on-error: true
      - name: Build
        run: yarn build
